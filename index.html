/* regras */
function liveSales(){return S.sales.filter(function(s){return !s.canceled;});}
function saleState(s){if(s.canceled)return 'cancelada';return S.entries.some(function(e){return e.saleId===s.id&&!e.paid;})?'aberto':'finalizada';}
function balances(){var b={caixa:0,conta:0};S.moves.forEach(function(m){b[m.account]+=m.amount;});return b;}
function monthKey(){var n=new Date();return {m:n.getFullYear()+'-'+pad(n.getMonth()+1),y:String(n.getFullYear())};}
function entryStatus(e){if(e.paid)return 'paga';return e.due<today()?'atrasada':'avencer';}
function r2(v){return Math.round(v*100)/100;}
function eDue(e){return r2(e.amount-(e.credit||0));}
function eGot(e){return r2(sum(e.payments||[],function(p){return p.applied;}));}
function eRem(e){return Math.max(0,r2(eDue(e)-eGot(e)));}
function refreshEntry(e,date){
  var ps=e.payments||[];
  if(eRem(e)<0.005){e.paid=true;if(!e.paidAt)e.paidAt=date||(ps.length?ps[ps.length-1].date:today());}
  else{e.paid=false;e.paidAt='';}
}
function accName(a){return a==='caixa'?'Caixa 1':'Conta Corrente';}
function brn(v){return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);}
function pvColor(c){return {bad:'var(--bad)',warn:'var(--warn)',ok:'var(--ok)',mut:'var(--mut)'}[c]||'var(--mut)';}
function laterOf(e){
  if(!e.saleId)return [];
  return S.entries.filter(function(x){return x.saleId===e.saleId&&x.type===e.type&&x.id!==e.id&&(x.n||0)>(e.n||0)&&eRem(x)>0;}).sort(function(a,b){return (a.n||0)-(b.n||0);});
}
function planPay(e,given){
  given=r2(given);
  var r=eRem(e),later=laterOf(e),max=r2(r+sum(later,eRem));
  var p={given:given,rem:r,max:max,ok:given>0&&given<=max+0.004,applied:Math.min(given,r),carry:[],left:0};
  var ex=r2(given-p.applied);
  later.forEach(function(l){if(ex<=0.004)return;var rl=eRem(l),t=Math.min(ex,rl);p.carry.push({e:l,amt:t,newDue:r2(rl-t)});ex=r2(ex-t);});
  p.left=r2(r-p.applied);
  return p;
}
function payPreview(e,val){
  var g=num(val),pl=planPay(e,g);
  if(!(g>0))return {t:'Digite o valor que o cliente deu.',c:'mut'};
  if(!pl.ok)return {t:'Passa do que falta. O máximo é '+brl.format(pl.max)+'.',c:'bad'};
  if(pl.left>0.004)return {t:'Vai ficar faltando '+brl.format(pl.left)+' nesta parcela.',c:'warn'};
  var t='Quita esta parcela.';
  if(pl.carry.length){
    var c0=pl.carry[0];
    t+=' Sobram '+brl.format(sum(pl.carry,function(x){return x.amt;}))+', descontados da parcela '+c0.e.n+'/'+c0.e.of+(pl.carry.length>1?' e das seguintes':'')+(c0.newDue<0.005?' (que fica quitada).':' (passa a faltar '+brl.format(c0.newDue)+').');
  }
  return {t:t,c:'ok'};
}
function registerPay(id,given,acc,date){
  var e=S.entries.find(function(x){return x.id===id;});if(!e)return null;
  if(!(given>0)){toast('Informe o valor recebido');return null;}
  var pl=planPay(e,given);
  if(!pl.ok){toast('O valor passa do que falta ('+brl.format(pl.max)+')',3500);return null;}
  date=date||today();
  var pay={id:uid(),date:date,amount:pl.given,applied:pl.applied,account:acc||'caixa',carry:[]};
  pl.carry.forEach(function(c){c.e.credit=r2((c.e.credit||0)+c.amt);pay.carry.push({eid:c.e.id,amt:c.amt});refreshEntry(c.e,date);});
  if(!Array.isArray(e.payments))e.payments=[];
  e.payments.push(pay);refreshEntry(e,date);
  S.moves.push({id:uid(),ts:Date.now(),date:date,account:pay.account,amount:e.type==='receber'?pay.amount:-pay.amount,desc:e.desc+(eRem(e)>0?' (parcial)':''),entryId:e.id,payId:pay.id});
  save();return pay;
}
function undoPay(id,payId){
  var e=S.entries.find(function(x){return x.id===id;});if(!e)return;
  var i=(e.payments||[]).findIndex(function(p){return p.id===payId;});if(i<0)return;
  var pay=e.payments[i];
  (pay.carry||[]).forEach(function(c){var x=S.entries.find(function(y){return y.id===c.eid;});if(x){x.credit=r2(Math.max(0,(x.credit||0)-c.amt));refreshEntry(x);}});
  e.payments.splice(i,1);refreshEntry(e);
  S.moves=S.moves.filter(function(m){return m.payId!==payId;});
  save();
}
function inPeriod(d,per){
  var n=new Date(),t=today();
  if(per==='tudo')return true;
  if(per==='hoje')return d===t;
  if(per==='semana'){var w=new Date(n);w.setDate(n.getDate()-((n.getDay()+6)%7));return d>=iso(w)&&d<=t;}
  if(per==='mes')return d.slice(0,7)===t.slice(0,7);
  if(per==='mespassado')return d.slice(0,7)===addMonths(t.slice(0,7)+'-01',-1).slice(0,7);
  if(per==='ano')return d.slice(0,4)===t.slice(0,4);
  return true;
}

function niceMax(mx){if(mx<=0)return 4;var mag=Math.pow(10,Math.floor(Math.log10(mx))),n=mx/mag,v=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return v*mag;}
function chart(){
  var now=new Date(),months=[],i;
  for(i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.getFullYear()+'-'+pad(d.getMonth()+1),l:MON[d.getMonth()],v:0});}
  liveSales().forEach(function(s){var m=months.find(function(x){return x.k===s.date.slice(0,7);});if(m)m.v+=s.total;});
  var mx=Math.max.apply(null,months.map(function(m){return m.v;})),top=niceMax(mx);
  var W=340,H=210,L=50,R=8,T=12,B=40,pw=W-L-R,ph_=H-T-B,band=pw/12,bw=band*0.62,out='',t;
  for(t=0;t<=4;t++){var val=top*t/4,y=T+ph_-ph_*t/4;
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-dasharray="3 3"/>';
    out+='<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+(S.hide?'':'R$ '+val.toLocaleString('pt-BR'))+'</text>';}
  months.forEach(function(m,i){
    var h=top?ph_*m.v/top:0,x=L+i*band+(band-bw)/2,y=T+ph_-h,cx=L+i*band+band/2;
    if(m.v>0)out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+(i===11?'var(--bar-now)':'var(--bar)')+'"/>';
    out+='<text transform="rotate(-45 '+(cx+4).toFixed(1)+' '+(H-B+14)+')" x="'+(cx+4).toFixed(1)+'" y="'+(H-B+14)+'" text-anchor="end" font-size="11" fill="var(--mut)">'+m.l+'</text>';
  });
  if(mx===0)out+='<text x="'+(L+pw/2)+'" y="'+(T+ph_/2)+'" text-anchor="middle" font-size="12" fill="var(--mut)">Nenhuma venda registrada ainda</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Gráfico de vendas dos últimos 12 meses">'+out+'</svg>';
}

function rfGroups(){
  var t=today(),map={},order=[],out={vencido:[],hoje:[],avencer:[],pagas:[]};

    g.bucket=b;out[b].push(g);});

function profitData(){

    s.items.forEach(function(i){var k=i.pid||i.name,o=m[k]||(m[k]={name:i.name,pid:i.pid,qty:0,rev:0,cost:0,nocost:false});
      o.qty+=i.qty;o.rev+=i.qty*i.price*f;o.cost+=i.qty*(i.cost||0);if(!i.cost)o.nocost=true;});
  });
  var a=Object.keys(m).map(function(k){var o=m[k];o.profit=o.rev-o.cost;o.margin=o.rev>0?o.profit/o.rev*100:0;o.unit=o.qty?o.profit/o.qty:0;o.avg=o.qty?o.rev/o.qty:0;o.cost1=o.qty?o.cost/o.qty:0;tot.rev+=o.rev;tot.cost+=o.cost;tot.qty+=o.qty;return o;});
  var key={lucro:'profit',qtd:'qty',margem:'margin',unit:'unit'}[lsort]||'profit';
  a.sort(function(x,y){return y[key]-x[key];});

  return {a:a,t:tot};
}

  String(t).split(/\r?\n/).forEach(function(l){
    var m=/^\s*(\d+)\s*[xX×]\s+(.+?)\s*(?:\(\s*c[óo]d\.?\s*([^)]+?)\s*\))?\s*-\s*R\$\s*[\d.,]+\s*$/.exec(l);if(!m)return;
    var name=m[2].trim(),bc=(m[3]||'').trim(),p=S.products.find(function(x){return (bc&&x.barcode===bc)||x.name.trim().toLowerCase()===name.toLowerCase();});
    items.push({code:p?String(p.code):name,qty:parseInt(m[1],10)||1});
  });
  if(!items.length)return null;
  return {id:uid(),tok:'t'+Date.now(),ts:Date.now(),date:today(),name:nm?nm[1].trim():'Cliente',items:items,status:'novo'};
}
function importOrder(tok,quiet){
  var d;try{d=b64d(tok);}catch(e){if(!quiet)toast('Pedido inválido');return false;}
  if(!d||!Array.isArray(d.i)||!d.i.length){if(!quiet)toast('Pedido inválido');return false;}
  var ex=S.orders.find(function(o){return o.tok===tok;});
  if(ex){toast('Esse pedido já está na lista');return ex.id;}
  var o={id:uid(),tok:tok,ts:Date.now(),date:today(),name:d.n||'Cliente',items:d.i.map(function(a){return {code:a[0],qty:parseInt(a[1],10)||1};}),status:'novo'};
  S.orders.unshift(o);save();return o.id;
}

function orderToCart(id){
  var o=S.orders.find(function(x){return x.id===id;});if(!o)return;
  var miss=[],cut=[];cart=[];pdv=pdvNew();
  o.items.forEach(function(i){var p=prodByCode(i.code);if(!p){miss.push(i.code);return;}var q=p.kind==='servico'?i.qty:Math.min(i.qty,Math.max(0,p.stock));if(q<i.qty)cut.push(p.name);if(q>0)cart.push({pid:p.id,qty:q});});
  if(!cart.length){toast('Nenhum item disponível em estoque');return;}
  var c=S.customers.find(function(x){return x.kind==='cliente'&&x.name.trim().toLowerCase()===String(o.name).trim().toLowerCase();});
  if(c)pdv.cust=c.id;pdv.orderId=o.id;pdv.obs='Pedido de '+o.name+'. Obrigada pela preferência!';o.status='andamento';save();
  closeSheet();go('pagto');
  if(cut.length||miss.length)toast('Atenção: quantidade ajustada ao estoque ('+cut.concat(miss).join(', ')+')',5000);
}

/* ===== Aniversários ===== */
function normBirth(v){
  v=String(v||'').trim();if(!v)return '';
  var m=/^(\d{1,2})\s*[\/\-. ]\s*(\d{1,2})(?:\s*[\/\-. ]\s*\d{2,4})?$/.exec(v);
  if(!m){var dg=digits(v);if(dg.length===4||dg.length===8)m=[0,dg.slice(0,2),dg.slice(2,4)];else return false;}
  var d=parseInt(m[1],10),mo=parseInt(m[2],10);
  if(mo<1||mo>12||d<1||d>31)return false;
  var dim=[31,29,31,30,31,30,31,31,30,31,30,31][mo-1];if(d>dim)return false;
  return pad(d)+'/'+pad(mo);
}
function birthIn(c){
  var b=normBirth(c.birth);if(!b)return -1;
  var d=parseInt(b.slice(0,2),10),mo=parseInt(b.slice(3,5),10),t=today(),y=parseInt(t.slice(0,4),10);
  var a=new Date(y,mo-1,d),n=new Date(y,parseInt(t.slice(5,7),10)-1,parseInt(t.slice(8,10),10));
  if(a<n)a=new Date(y+1,mo-1,d);
  return Math.round((a-n)/86400000);
}
function birthList(){
  return S.customers.filter(function(c){return c.kind==='cliente'&&normBirth(c.birth);}).map(function(c){return {c:c,in:birthIn(c)};}).sort(function(a,b){return a.in-b.in||a.c.name.localeCompare(b.c.name,'pt-BR');});
}
function bdText(c){return (S.bdTpl||DEFAULT_BD).replace(/\{nome\}/g,(c.name||'').split(' ')[0]).replace(/\{loja\}/g,S.biz||'');}
function bdLink(c){var n=waNumber(c);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(bdText(c)):'';}
function vAniv(){
  var l=birthList(),h=ph('Aniversários',l.length+' cliente(s)','Clientes com aniversário cadastrado. Mande uma mensagem de parabéns pelo WhatsApp e fidelize.');
  var semBd=S.customers.filter(function(c){return c.kind==='cliente'&&!normBirth(c.birth);}).length;
  var sec=function(title,arr,cls){
    if(!arr.length)return '';
    return '<h2 style="margin:6px 0 0">'+title+' ('+arr.length+')</h2><div class="list">'+arr.map(function(x){var c=x.c,lk=bdLink(c);
      return '<div class="item" style="align-items:center;gap:10px"><div class="grow"><div class="t">'+esc(c.name)+'</div><div class="s">'+esc(normBirth(c.birth))+(x.in===0?' · <b style="color:var(--bad)">é hoje!</b>':x.in===1?' · amanhã':' · em '+x.in+' dias')+'</div></div>'+(lk?'<a class="btn wa sm" style="text-decoration:none" href="'+lk+'" target="_blank" rel="noopener">Parabéns</a>':'<button class="btn sm" data-act="nophone" data-id="'+c.id+'">Sem telefone</button>')+'</div>';}).join('')+'</div>';
  };
  var hoje=l.filter(function(x){return x.in===0;}),prox=l.filter(function(x){return x.in>0&&x.in<=30;}),dep=l.filter(function(x){return x.in>30;});
  if(!l.length)h+='<div class="empty"><b>Nenhum aniversário cadastrado</b>Em Clientes, toque no cliente e preencha o campo "Aniversário (dia e mês)".</div>';

  return h;
}

/* ===== Quem está devendo ===== */
var dvs='valor';
function devedores(){
  var m={},t=today();
  S.entries.filter(function(e){return e.type==='receber'&&!e.paid&&eRem(e)>0.004;}).forEach(function(e){
    var c=cust(e.customerId),k=c?c.id:'n:'+e.desc.replace(/ · \d+\/\d+$/,'');
    var o=m[k]||(m[k]={c:c,name:c?c.name:e.desc.replace(/ · \d+\/\d+$/,''),es:[],sales:{}});
    o.es.push(e);o.sales[e.saleId||e.id]=1;
  });
  var a=Object.keys(m).map(function(k){var o=m[k];
    o.es.sort(function(x,y){return x.due<y.due?-1:1;});
    o.total=sum(o.es,eRem);
    var lt=o.es.filter(function(e){return e.due<t;});
    o.late=sum(lt,eRem);o.days=lt.length?-daysTo(lt[0].due):0;o.nsales=Object.keys(o.sales).length;
    return o;});
  a.sort(function(x,y){return dvs==='atraso'?(y.days-x.days)||(y.total-x.total):(y.total-x.total);});
  return a;
}
function devText(o){
  var t=today(),nm=(o.name||'').split(' ')[0];
  var s='Olá, '+nm+'! Aqui é da '+S.biz+'. Passando para lembrar que você tem '+brl.format(o.total)+' em aberto';
  if(o.late>0.004)s+=' ('+brl.format(o.late)+' já vencido)';
  s+=':\n';
  o.es.slice(0,8).forEach(function(e){s+='• '+fdate(e.due)+' - '+brl.format(eRem(e))+(e.due<t?' (vencida)':'')+'\n';});
  if(o.es.length>8)s+='e mais '+(o.es.length-8)+' parcelas\n';
  return s+'Se você já pagou, pode desconsiderar. Qualquer dúvida, é só chamar!';
}

var inclPrev=true;
function openOf(x){return S.entries.filter(function(e){return e.saleId===x.id&&!e.paid;}).sort(function(a,b){return (a.n||0)-(b.n||0);});}
function salePar(x){return S.entries.filter(function(e){return e.saleId===x.id;}).sort(function(a,b){return (a.n||0)-(b.n||0);});}
function parSt(e){return e.paid?'paga':eGot(e)>0.004?'falta '+brl.format(eRem(e)):'';}
function parTxt(e){return brl.format(eDue(e))+(e.paid?' - PAGA':eGot(e)>0.004?' - pagou '+brl.format(eGot(e))+', falta '+brl.format(eRem(e)):(e.due<today()?' - atrasada':' - a vencer'));}
function prevAll(s){if(!s.customerId)return [];return S.sales.filter(function(x){return x.id!==s.id&&x.customerId===s.customerId&&!x.canceled&&openOf(x).length;}).sort(function(a,b){return a.no-b.no;});}
function prevSales(s){return inclPrev?prevAll(s):[];}
function totalAberto(s){var t=0;openOf(s).forEach(function(e){t+=eRem(e);});prevSales(s).forEach(function(x){openOf(x).forEach(function(e){t+=eRem(e);});});return t;}
function receiptText(s){
  var c=cust(s.customerId),parc=S.entries.filter(function(e){return e.saleId===s.id;}).sort(function(a,b){return (a.n||0)-(b.n||0);});
  var t='*'+S.biz+'*\nData: '+fdate(s.date)+'\n'+(c?'Cliente: '+c.name+'\n':'')+'\nItens:\n';
  s.items.forEach(function(i){t+=i.qty+' x '+i.name+' - '+brl.format(i.qty*i.price)+'\n'+(codeOf(i)?'   Cód. de barras: '+codeOf(i)+'\n':'');});
  if(s.disc)t+='\nDesconto: -'+brl.format(s.disc);
  t+='\n*Total da compra: '+brl.format(s.total)+'*\n';
  if(s.method==='fiado'){
    var n=parc.length||1;
    t+='\nPagamento: Fiado em '+n+'x\n\nParcelas:\n';
    parc.forEach(function(e){t+=(n>1?e.n+'/'+n:'Parcela única')+' - vence em '+fdate(e.due)+' - '+parTxt(e)+'\n';});
  }else t+='\nPagamento: '+methText(s)+' - pago em '+fdate(s.date)+'\n';
  var pv=prevSales(s);
  if(pv.length){
    t+='\n----------------\n*Outras compras em aberto*\n';
    pv.forEach(function(x){
      t+='\n*Compra de '+fdate(x.date)+'*\n';
      x.items.forEach(function(i){t+=i.qty+' x '+i.name+' - '+brl.format(i.qty*i.price)+'\n';});
      t+='Total da compra: '+brl.format(x.total)+'\n';

function addToCart(id,q){
  var p=prod(id);if(!p)return;q=q||1;
  var c=cart.find(function(x){return x.pid===id;}),cur=c?c.qty:0;
  if(cur+q>stockOf(p)){toast('Estoque insuficiente');return false;}
  if(c)c.qty+=q;else cart.push({pid:id,qty:q});render();return true;
}
function finish(){
  if(!cart.length){toast('Adicione produtos ao carrinho');return;}
  if(!pdv.split&&!pdv.method){toast('Escolha a forma de pagamento');return;}
  var t=pdvTotals();
  if(pdv.split){
    var pp=pdv.parts.filter(function(q){return num(q.v)>0;});
    if(pp.length<2){toast('Informe o valor de pelo menos duas formas');return;}
    if(Math.abs(r2(t.total-splitSum()))>0.004){toast('A soma dos pagamentos precisa ser igual ao total');return;}
    if(pp.length!==pdv.parts.length){toast('Remova a forma sem valor');return;}
  }
  if(!pdv.split&&pdv.method==='fiado'){
    var cc=pdv.cust&&cust(pdv.cust);
    if(!cc){toast('Escolha o cliente para vender no fiado');return;}
    if(cc.status==='bloqueado'){toast('Cliente bloqueado para fiado');return;}
  }
  if(!pdv.split&&pdv.method==='dinheiro'&&num(pdv.recv)>0&&num(pdv.recv)<t.total){toast('O valor recebido é menor que o total');return;}
  for(var i=0;i<cart.length;i++){var p=prod(cart[i].pid);if(!p||cart[i].qty>stockOf(p)){toast('Estoque insuficiente: '+(p?p.name:'produto removido'));return;}}
  S.seq++;
  var sale={id:uid(),no:S.seq,date:today(),ts:Date.now(),items:cart.map(function(c){var p=prod(c.pid);return {pid:p.id,name:p.name,code:p.code,barcode:p.barcode||'',qty:c.qty,price:itemPrice(c,p),cost:p.cost||0};}),disc:t.disc,total:t.total,method:pdv.split?'misto':pdv.method,customerId:pdv.cust||'',obs:pdv.obs};
  if(pdv.split)sale.pays=pdv.parts.map(function(q){return {method:q.m,amount:r2(num(q.v))};});
  cart.forEach(function(c){var p=prod(c.pid);if(p.kind!=='servico')p.stock-=c.qty;});
  if(!pdv.split&&pdv.method==='fiado'){
    var n=parseInt(pdv.inst||'1',10),ev=pdv.every||'mensal',first=pdv.due||firstDue(ev),parts=splitAmount(t.total,n);
    sale.installments=n;
    parts.forEach(function(v,k){S.entries.push({id:uid(),type:'receber',desc:'Venda #'+sale.no+(n>1?' · '+(k+1)+'/'+n:''),amount:v,due:addEvery(first,k,ev),paid:false,saleId:sale.id,customerId:sale.customerId,n:k+1,of:n,payments:[],credit:0});});
  }else if(pdv.split){sale.pays.forEach(function(q){S.moves.push({id:uid(),ts:Date.now(),date:today(),account:q.method==='dinheiro'?'caixa':'conta',amount:q.amount,desc:'Venda #'+sale.no+' ('+METHODS[q.method]+')',saleId:sale.id});});}
  else{S.moves.push({id:uid(),ts:Date.now(),date:today(),account:pdv.method==='dinheiro'?'caixa':'conta',amount:t.total,desc:'Venda #'+sale.no,saleId:sale.id});}
  S.sales.push(sale);if(pdv.orderId){var od=S.orders.find(function(x){return x.id===pdv.orderId;});if(od){od.status='vendido';od.saleNo=sale.no;}}save();
  cart=[];pdv=pdvNew();
  go('pdv');toast('Venda #'+sale.no+' registrada');sheetSale(sale.id);
}
function cancelSale(id){
  var s=S.sales.find(function(x){return x.id===id;});if(!s||s.canceled)return;
  s.canceled=true;
  s.items.forEach(function(i){var p=prod(i.pid);if(p&&p.kind!=='servico')p.stock+=i.qty;});
  var eids=S.entries.filter(function(e){return e.saleId===id;}).map(function(e){return e.id;});
  S.moves=S.moves.filter(function(m){return m.saleId!==id&&eids.indexOf(m.entryId)<0;});
  S.entries=S.entries.filter(function(e){return e.saleId!==id;});
  save();closeSheet();render();toast('Venda cancelada');
}

function backup(){
  var txt=JSON.stringify(S).replace(/"logo":"[^"]*"/,'"logo":""');
  var fb=function(){openSheet(head('Backup')+'<div class="field"><label for="bk">Copie todo o texto abaixo e guarde</label><textarea id="bk" rows="8" readonly>'+esc(txt)+'</textarea></div>');var t=$('#bk');if(t){t.focus();t.select();}};
  try{navigator.clipboard.writeText(txt).then(function(){toast('Backup copiado. Cole em um lugar seguro.');},fb);}catch(e){fb();}

function backupFile(){
  var d=JSON.parse(JSON.stringify(S));d.logo='';
  var txt=JSON.stringify(d),name='caixa-facil-backup-'+today()+'.json',blob=new Blob([txt],{type:'application/json'});
  var done=function(){S.lastBackup=today();save();toast('Backup salvo: '+name,4000);if(view==='dados')render();};
  if(DL){DL.save({filename:name,data:blob}).then(done,function(e){if(!e||e.code!=='declined')toast('Não foi possível salvar o arquivo');});return;}
  try{var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);done();}catch(e){backup();}
}
function restoreData(txt){
  var o2=JSON.parse(txt),f0=fresh();if(!Array.isArray(o2.products)||!Array.isArray(o2.sales))throw 0;
  for(var key in f0){if(!(key in o2))o2[key]=f0[key];}
  o2.logo=S.logo||'';o2.logoV2=1;S=migrate(o2);cart=[];save();closeSheet();go('home');toast('Backup restaurado');
}
function restoreOpen(){openSheet(head('Restaurar backup')+'<form data-form="restore"><div class="field"><label for="rt">Cole aqui o texto do backup</label><textarea id="rt" name="data" rows="7" required></textarea></div><p class="small mut" style="margin:0">Isso substitui os dados atuais.</p><button class="btn primary block" type="submit">Restaurar</button></form><div class="field"><label for="rfile">Ou escolha o arquivo de backup</label><input id="rfile" type="file" accept=".json,application/json,text/plain"></div>');}

    var fr=new FileReader();fr.onload=function(){try{restoreData(String(fr.result));}catch(e){toast('Arquivo de backup inválido');}};fr.readAsText(t.files[0]);
  }

    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(360,im.width),h=Math.max(1,Math.round(im.height*w/im.width)),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);try{S.logo=cv.toDataURL('image/png');save();render();toast('Logomarca salva');}catch(e){toast('Não foi possível usar esta imagem');}};im.onerror=function(){toast('Imagem inválida');};im.src=r.result;};
    r.readAsDataURL(t.files[0]);
  }
});
document.addEventListener('submit',function(ev){
  var f=ev.target.closest('form[data-form]');if(!f)return;ev.preventDefault();
  var d=Object.fromEntries(new FormData(f).entries()),k=f.dataset.form;
  if(k==='prod'){
    var name=(d.name||'').trim(),price=num(d.price);
    if(!name||price<=0){toast('Informe o nome e um preço maior que zero');return;}
    var pp2=num(d.promoPrice);if(d.promo&&!(pp2>0&&pp2<price)){toast('Promoção: o preço promocional precisa ser menor que o preço de venda',5000);return;}
    var svc=d.kind==='servico';
    var obj={name:name,price:price,cost:num(d.cost),kind:d.kind||'produto',cat:d.cat||'',barcode:(d.barcode||'').trim(),stock:svc?0:Math.max(0,Math.floor(num(d.stock))),unit:svc?'UN':(d.unit||'UN'),exp:svc?'':(d.exp||''),img:pimgs[0]||pimgs[1]||'',img2:pimgs[0]?(pimgs[1]||''):'',desc:(d.desc||'').trim(),catOn:!!d.catOn,launch:!!d.launch,feat:!!d.feat,promo:!!d.promo,promoPrice:pp2};
    if(d.id){var p=prod(d.id);if(p)Object.assign(p,obj);}else{S.pseq++;obj.id=uid();obj.code=S.pseq;S.products.push(obj);}
    save();closeSheet();render();toast('Salvo');
  }else if(k==='cust'){
    var n=(d.name||'').trim();if(!n){toast('Informe o nome');return;}
    var o={name:n,phone:(d.phone||'').trim(),doc:(d.doc||'').trim(),email:(d.email||'').trim(),note:(d.note||'').trim(),kind:d.kind||'cliente',status:d.status||'aprovado'};
    var bd=normBirth(d.birth);if(bd===false){toast('Aniversário: use dia e mês, ex.: 15/03',4000);return;}o.birth=bd;
    if(d.id){var c=cust(d.id);if(c)Object.assign(c,o);}else{o.id=uid();S.customers.push(o);}
    save();closeSheet();render();toast('Contato salvo');
  }else if(k==='entry'){
    var amt=num(d.amount);if(!d.desc.trim()||amt<=0||!d.due){toast('Preencha descrição, valor e vencimento');return;}
    S.entries.push({id:uid(),type:d.type,desc:d.desc.trim(),amount:amt,due:d.due,paid:false,customerId:d.customerId||'',payments:[],credit:0});
    save();closeSheet();go(d.type);toast('Conta salva');
  }else if(k==='due'){
    var de=S.entries.find(function(x){return x.id===d.id;});if(!de)return;
    if(!d.due){toast('Escolha a nova data');return;}
    de.due=d.due;save();render();sheetEntryDetail(de.id);toast('Data alterada para '+fdate(de.due));
  }else if(k==='addit'){
    var as=S.sales.find(function(x){return x.id===d.id;});if(!as||as.canceled)return;
    var add=[],bad=null;
    S.products.forEach(function(p){var q=Math.floor(num(d['q_'+p.id]));if(!(q>0))return;if(q>stockOf(p)){bad=p;return;}add.push({p:p,q:q});});
    if(bad){toast('Estoque insuficiente: '+bad.name,4000);return;}
    if(!add.length){toast('Coloque a quantidade de algum produto');return;}
    var added=0;
    add.forEach(function(a){var p=a.p,ex=as.items.find(function(i){return i.pid===p.id&&i.price===sellPrice(p);});
      if(ex)ex.qty+=a.q;else as.items.push({pid:p.id,name:p.name,code:p.code,barcode:p.barcode||'',qty:a.q,price:sellPrice(p),cost:p.cost||0});
      if(p.kind!=='servico')p.stock-=a.q;added+=a.q*sellPrice(p);});
    added=r2(added);as.total=r2(as.total+added);
    var aes=S.entries.filter(function(e){return e.saleId===as.id;}),aop=aes.filter(function(e){return !e.paid;});
    if(aop.length){var parts=splitAmount(added,aop.length);aop.forEach(function(e,i){e.amount=r2(e.amount+parts[i]);});}
    else{var nn=aes.length+1;aes.forEach(function(e){e.of=nn;});
      S.entries.push({id:uid(),type:'receber',saleId:as.id,customerId:as.customerId||'',desc:'Venda #'+as.no+(nn>1?' · '+nn+'/'+nn:''),amount:added,due:today(),paid:false,n:nn,of:nn,payments:[],credit:0});}
    save();render();
    if(S.entries.some(function(e){return e.saleId===as.id;}))sheetGroup(as.id);else sheetSale(as.id);
    toast('Produtos adicionados: '+brl.format(added));
  }else if(k==='pay'){
    var pe=S.entries.find(function(x){return x.id===d.id;});if(!pe)return;
    var pay=registerPay(d.id,num(d.v),d.acc||'caixa',d.date||today());
    if(pay){closeSheet();render();toast(pe.type==='receber'?'Recebimento registrado':'Pagamento registrado');if(pe.type==='receber')sheetPay(d.id,pay.id);}
  }else if(k==='item'){
    var ci=cart.find(function(x){return x.pid===d.id;}),pp=prod(d.id),q2=Math.max(1,Math.floor(num(d.qty))),pr=num(d.price);
    if(ci&&pp){if(q2>stockOf(pp)){toast('Estoque insuficiente');return;}ci.qty=q2;ci.price=pr>0&&pr!==sellPrice(pp)?pr:null;}
    closeSheet();render();
  }else if(k==='disc'){pdv.disc=d.v;closeSheet();render();
  }else if(k==='obs'){pdv.obs=(d.v||'').trim()||'Obrigada pela preferência!';closeSheet();render();
  }else if(k==='cat'){
    var cn=(d.name||'').trim();if(!cn)return;if(S.cats.indexOf(cn)<0)S.cats.push(cn);save();render();
  }else if(k==='biz'){
    S.biz=(d.biz||'').trim()||'Meu Negócio';S.owner=(d.owner||'').trim();S.email=(d.email||'').trim();save();render();toast('Dados salvos');
  }else if(k==='cfg'){
    var np=(d.myphone||'').trim();if(np&&digits(np).length<10){toast('Número incompleto. Coloque o DDD + número, ex.: 11 99999-9999',5000);return;}S.myPhone=np;S.expMonths=parseInt(d.exp,10)||6;S.minStock=Math.max(0,parseInt(d.minstock,10)||0);S.bdTpl=(d.bdtpl||'').trim()||DEFAULT_BD;S.msgTpl=(d.tpl||'').trim()||DEFAULT_TPL;save();render();toast('Avisos salvos');
  }else if(k==='f-cust'){cs=d.status;csort=d.sort;closeSheet();render();
  }else if(k==='f-prod'){pcat=d.cat;pst=d.stk;pkind=d.kind;closeSheet();render();
  }else if(k==='f-sales'){smeth=d.meth;closeSheet();render();
  }else if(k==='pcolar'){
    var ptx=d.po||'',mm=/PEDIDO:\s*([A-Za-z0-9_-]+)/.exec(ptx)||/#o=([A-Za-z0-9_-]+)/.exec(ptx),pid=mm?importOrder(mm[1],true):false;
    if(!pid){var po=parseOrderText(ptx);if(po){S.orders.unshift(po);save();pid=po.id;}}
    if(pid){closeSheet();go('pedidos');render();toast('Pedido recebido');}
    else{var pm=$('#pomsg');if(pm)pm.textContent='Não consegui entender esse pedido. Copie a mensagem inteira que o cliente enviou, do começo ao fim.';}
  }else if(k==='restore'){
    try{var o2=JSON.parse(d.data),f0=fresh();if(!Array.isArray(o2.products)||!Array.isArray(o2.sales))throw 0;for(var key in f0){if(!(key in o2))o2[key]=f0[key];}S=migrate(o2);cart=[];save();closeSheet();go('home');toast('Backup restaurado');}
    catch(e){toast('Texto de backup inválido');}
  }
});
